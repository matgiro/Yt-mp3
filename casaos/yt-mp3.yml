name: yt-mp3
services:
  yt-mp3:
    image: ghcr.io/matgiro/yt-mp3:latest
    container_name: yt-mp3
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      TZ: Europe/Paris
      MP3_QUALITY: "192"        # 128, 192, 256 ou 320
      DEFAULT_ALBUM: "YouTube"  # album mis dans les tags si non précisé
      MAX_DURATION: "900"       # ignore les vidéos de plus de 15 min (0 = pas de limite)
      MUSIC_DIR: "/DATA/Media/Music" # dossier par défaut (modifiable ensuite dans ⚙ Réglages de l'appli)
      SEARCH_RESULTS: "6"       # nb de résultats YouTube comparés pour choisir la bonne version
    volumes:
      - /DATA:/DATA                     # stockage CasaOS (choix du dossier dans ⚙ Réglages)
      - /media:/media                   # disques externes / USB
      - /DATA/AppData/yt-mp3:/data      # file d'attente / historique

x-casaos:
  main: yt-mp3
  architectures: [amd64]
  category: Media
  author: matgiro
  developer: matgiro
  index: /
  port_map: "8095"
  scheme: http
  title:
    en_us: YT MP3
    fr_fr: YT MP3
  tagline:
    en_us: Song list to MP3 from YouTube
    fr_fr: Liste de chansons vers MP3 depuis YouTube
  description:
    en_us: Paste a list of songs, get tagged MP3s in your Navidrome library.
    fr_fr: Colle une liste de chansons, récupère des MP3 tagués dans ta bibliothèque Navidrome.
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/youtube-music.png
